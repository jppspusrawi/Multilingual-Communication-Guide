  --f-body:"Inter",system-ui,sans-serif;
  --f-ar:"Amiri",serif;
  --f-ar-ui:"Noto Kufi Arabic","Amiri",serif;
  --f-zh:"Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{font-family:var(--f-body);color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
.ar{font-family:var(--f-ar);direction:rtl;font-feature-settings:"liga" 1}
.zh{font-family:var(--f-zh)}
/* target text switches font/dir by version */
.tg.ar{font-family:var(--f-ar);direction:rtl}
.tg.zh{font-family:var(--f-zh);direction:ltr}

/* ---------- Masthead ---------- */
.masthead{background:linear-gradient(160deg,var(--navy) 0%,#0b1738 100%);color:#fff;position:relative;overflow:hidden}
.masthead::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 80% at 85% -20%,rgba(210,31,44,.35),transparent 55%),
  radial-gradient(90% 70% at -10% 120%,rgba(43,127,184,.30),transparent 55%);pointer-events:none}
.mast-inner{max-width:1180px;margin:0 auto;padding:26px 24px 26px;position:relative;z-index:1}
.logos{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logos img{background:#fff;border-radius:13px;padding:10px 16px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.logos .pusrawi{height:46px;display:block}
.logos .unit{height:68px;display:block}
.logos-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.top-seg{background:#ffffff14;border-color:#ffffff33}
.top-seg button{color:#dbe6ff;padding:7px 13px;font-size:12px}
.top-seg button.on{background:#fff;color:var(--navy)}
@media (max-width:520px){.logos{gap:10px}.logos .pusrawi{height:34px}.logos .unit{height:52px}.logos img{padding:8px 12px}.logos-right{gap:7px}.top-seg button{padding:6px 11px;font-size:11.5px}}
.crumb{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9fb3dd;font-weight:600}
.mast-title{margin-top:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.mast-title h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.6vw,46px);line-height:1.02;letter-spacing:-.02em}
.mast-title h1 .thin{color:#8fa6d6;font-weight:500}
.title-tg{color:#fff;line-height:1.4;font-size:clamp(24px,4vw,40px)}
.title-tg.ar{font-family:var(--f-ar);direction:rtl}
.title-tg.zh{font-family:var(--f-zh)}
.mast-sub{margin-top:12px;color:#c3cfe8;max-width:640px;font-size:14.5px}

/* ---------- Language chooser ---------- */
.langbar{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.langrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.langrow .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9fb3dd;font-weight:700;width:100%}
.verbtn{display:flex;align-items:center;gap:11px;border:1.5px solid #ffffff33;background:#ffffff12;color:#fff;
  padding:11px 18px;border-radius:14px;cursor:pointer;font:inherit;transition:all .15s;min-width:200px}
.verbtn:hover{background:#ffffff20;border-color:#ffffff55}
.verbtn.on{background:#fff;color:var(--navy);border-color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.verbtn .big{font-size:26px;line-height:1}
.verbtn .big.ar{font-family:var(--f-ar)}
.verbtn .big.zh{font-family:var(--f-zh);font-weight:900}
.verbtn .lab{text-align:left;line-height:1.15}
.verbtn .lab b{font-family:var(--f-display);font-weight:700;font-size:15px;display:block}
.verbtn .lab span{font-size:12px;opacity:.8}
.seg{display:inline-flex;border:1.5px solid #ffffff33;border-radius:12px;overflow:hidden;background:#ffffff10}
.seg button{border:none;background:none;color:#dbe6ff;font:inherit;font-weight:700;font-size:13.5px;padding:9px 18px;cursor:pointer;transition:all .12s}
.seg button.on{background:#fff;color:var(--navy)}
.seg .cap2{align-self:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9fb3dd;font-weight:700;margin-right:4px}

/* ---------- Toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:40;background:rgba(238,241,247,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-inner{max-width:1180px;margin:0 auto;padding:11px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:150px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:15px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px #10214e22}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}
.tb-seg{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:3px}
.tb-seg button{border:none;background:none;font:inherit;font-weight:700;font-size:13px;padding:8px 17px;cursor:pointer;color:var(--muted);border-radius:999px;transition:background .12s,color .12s}
.tb-seg button.on{background:var(--navy);color:#fff}
.tb-seg .d{display:none}

/* ---------- Layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:start}
.rail{position:sticky;top:70px;display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 90px);overflow-y:auto;padding-right:4px}
.rail::-webkit-scrollbar{width:6px}.rail::-webkit-scrollbar-thumb{background:#c4cede;border-radius:3px}
.rail-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 8px 8px}
.tab{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;border:none;background:none;text-align:left;font:inherit;width:100%;color:var(--ink);transition:background .15s}
.tab:hover{background:#fff}
.tab .dot{width:12px;height:12px;border-radius:4px;flex:none;background:var(--c)}
.tab .n{font-size:11px;color:var(--muted);font-weight:700;min-width:16px}
.tab .lbl{font-size:13px;font-weight:600;line-height:1.2}
.tab.active{background:#fff;box-shadow:var(--shadow)}
.tab.active .lbl{color:var(--c)}
.tab:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* sections */
.sections{min-width:0}
.section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;scroll-margin-top:74px;border:1px solid var(--line)}
.sec-head{--c:var(--accent);background:linear-gradient(100deg,var(--c),color-mix(in srgb,var(--c) 78%,#000));color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.sec-head .l{display:flex;align-items:center;gap:14px;min-width:0}
.sec-num{font-family:var(--f-display);font-weight:800;font-size:22px;background:#ffffff26;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.sec-en{font-family:var(--f-display);font-weight:700;font-size:clamp(16px,2.3vw,21px);letter-spacing:-.01em;line-height:1.1}
.sec-tg{font-size:clamp(19px,2.6vw,27px);line-height:1.3;text-align:right}
.sec-tg.ar{font-family:var(--f-ar);direction:rtl}
.sec-tg.zh{font-family:var(--f-zh)}
.sec-body{padding:20px 22px 24px}
.note{display:flex;gap:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 30%,transparent);border-radius:12px;padding:12px 15px;margin-bottom:18px;font-size:14px}
.note .ntxt{flex:1}.note .ntxt .tg{margin-top:4px;font-size:16px;color:var(--ink)}
.note .ntxt .tg.ar{font-family:var(--f-ar);direction:rtl}.note .ntxt .tg.zh{font-family:var(--f-zh)}
.note .ntxt .py{font-size:12.5px;color:var(--muted);margin-top:2px;font-style:italic}
.note .ic{font-size:18px;flex:none}
.pending-tag{display:inline-block;background:#e07b1a;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:6px;text-transform:uppercase;margin-left:8px;vertical-align:middle}

.sublabel{display:flex;align-items:baseline;gap:12px;margin:20px 0 12px;flex-wrap:wrap}
.sublabel:first-child{margin-top:0}
.sublabel .en{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--navy);text-transform:uppercase;letter-spacing:.03em}
.sublabel .tg{font-size:18px;color:var(--muted)}
.sublabel .tg.ar{font-family:var(--f-ar-ui);direction:rtl}.sublabel .tg.zh{font-family:var(--f-zh)}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{--c:var(--accent);position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 12px 13px;cursor:pointer;text-align:center;transition:transform .12s,box-shadow .12s,border-color .12s;display:flex;flex-direction:column;align-items:center;gap:6px}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(16,33,78,.13);border-color:var(--c)}
.card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.card .emoji{font-size:30px;line-height:1}
.card .badge{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c);line-height:1}
.card .tg{font-weight:700;font-size:21px;color:var(--navy);line-height:1.5}
.card .tg.ar{font-family:var(--f-ar);direction:rtl}
.card .tg.zh{font-family:var(--f-zh);font-size:22px}
.card .py{font-size:12px;color:var(--muted);font-style:italic;line-height:1.2}
.card .hl{font-weight:600;font-size:13px;color:var(--ink);line-height:1.25}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--c);border-radius:14px 14px 0 0;opacity:0;transition:opacity .12s}
.card:hover::before{opacity:1}

/* phrase list */
.phrase-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phrase{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.phrase:hover{border-color:var(--c);box-shadow:0 6px 16px rgba(16,33,78,.10)}
.phrase:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.phrase .hl{font-weight:600;font-size:14px;flex:1}
.phrase .rgt{text-align:right}
.phrase .tg{font-weight:700;font-size:22px;color:var(--navy);line-height:1.5}
.phrase .tg.ar{font-family:var(--f-ar);direction:rtl}
.phrase .tg.zh{font-family:var(--f-zh);font-size:20px}
.phrase .py{font-size:11.5px;color:var(--muted);font-style:italic}
.phrase.emg{background:#fff4f4;border-color:#f3b6ba}
.phrase.emg .hl{color:var(--red)}.phrase.emg .tg{color:var(--red)}

/* registration form */
.regform{display:grid;gap:8px;margin:6px 0 4px}
.regrow{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-items:stretch}
.reglabel{background:var(--accent-soft);border:1.5px solid color-mix(in srgb,var(--c,var(--accent)) 26%,transparent);border-radius:11px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.reglabel .hl{font-weight:600;font-size:14px}
.reglabel .tg{font-weight:700;font-size:19px;color:var(--navy)}
.reglabel .tg.ar{font-family:var(--f-ar);direction:rtl}.reglabel .tg.zh{font-family:var(--f-zh);font-size:17px}
.regfield{border:1.5px dashed var(--line);border-radius:11px;background:#fafbfe}
.resp-row{margin-top:16px}
.resp-row .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

/* info blocks (schedule/contacts/links) */
.iblock{margin-top:18px}
.iblock:first-child{margin-top:0}
.itable{border:1.5px solid var(--line);border-radius:13px;overflow:hidden}
.irow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:none}
.irow .k .en{font-weight:600;font-size:14px}
.irow .k .tg{font-size:17px;color:var(--navy);margin-top:2px}
.irow .k .tg.ar{font-family:var(--f-ar);direction:rtl}.irow .k .tg.zh{font-family:var(--f-zh)}
.irow .k .py{font-size:11.5px;color:var(--muted);font-style:italic}
.irow .v{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);text-align:right;white-space:nowrap}
.irow .v.tel{color:var(--navy)}
.irow a.v{text-decoration:none}
.irow a.v:hover{text-decoration:underline}
.irow.link{grid-template-columns:1fr auto}
.irow.link .lk{color:var(--navy);font-weight:600;font-size:14px;word-break:break-all}
.pending .itable{background:repeating-linear-gradient(135deg,#fff7ec,#fff7ec 12px,#fffaf3 12px,#fffaf3 24px)}
.irow .v.dash{color:var(--muted);font-weight:600}

/* ---------- Patient overlay ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(11,18,44,.66);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.pcard{--c:var(--navy);background:#fff;border-radius:26px;max-width:560px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .22s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.pcard-top{background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 72%,#000));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.pcard-body{padding:38px 30px 30px;text-align:center}
.pcard-emoji{font-size:74px;line-height:1;margin-bottom:14px}
.pcard-badge{font-family:var(--f-display);font-weight:800;font-size:60px;color:var(--c);line-height:1;margin-bottom:10px}
.pcard-tg{font-weight:700;font-size:clamp(34px,7.5vw,56px);color:var(--navy);line-height:1.5;margin-bottom:8px}
.pcard-tg.ar{font-family:var(--f-ar);direction:rtl}
.pcard-tg.zh{font-family:var(--f-zh)}
.pcard-py{font-size:18px;color:var(--muted);font-style:italic;margin-bottom:10px}
.pcard-en{font-size:20px;font-weight:600;color:var(--muted)}
.pcard-foot{border-top:1px solid var(--line);padding:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pbtn{border:none;font:inherit;font-weight:600;font-size:14px;padding:10px 20px;border-radius:11px;cursor:pointer;background:var(--navy);color:#fff}
.pbtn.ghost{background:#eef1f7;color:var(--navy)}
.pbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- Footer ---------- */
.foot{background:var(--navy);color:#c3cfe8;padding:30px 24px 40px}
.foot-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.foot .warn{background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:14px 18px;max-width:660px;font-size:13.5px}
.foot .warn .tg{margin-top:6px;font-size:15px;color:#e6edff}
.foot .warn .tg.ar{font-family:var(--f-ar);direction:rtl}.foot .warn .tg.zh{font-family:var(--f-zh)}
.foot .verify{background:#e07b1a22;border:1px solid #e07b1a66;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:12.5px;color:#ffd9b0}
.foot .brand{font-family:var(--f-display);font-weight:700;color:#fff;font-size:15px}
.foot .brand span{color:#8fa6d6;font-weight:500;display:block;font-size:12.5px;font-family:var(--f-body)}
.foot .iu{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7d90bd;margin-top:8px}
.noresult{padding:40px;text-align:center;color:var(--muted);display:none}
.noresult.on{display:block}

/* ---------- Install ---------- */
.install{display:none;align-items:center;gap:12px;background:linear-gradient(120deg,var(--navy),#0b1738);color:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:18px}
.install.on{display:flex}
.install .ico{flex:none;width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:24px}
.install .txt{flex:1;min-width:0}
.install .txt b{font-family:var(--f-display);font-size:15px;display:block}
.install .txt span{font-size:12.5px;color:#c3cfe8;display:block;margin-top:2px}
.install-btn{flex:none;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:14px;color:var(--navy);background:#fff;padding:10px 18px;border-radius:11px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.install-x{flex:none;border:none;background:#ffffff22;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1}
.ios-steps{display:none;margin-top:10px;background:#ffffff14;border:1px solid #ffffff26;border-radius:11px;padding:10px 13px;font-size:13px;color:#e6edff;width:100%}
.ios-steps.on{display:block}
.ios-steps b{color:#fff}
.install.ios-mode{flex-wrap:wrap}

/* ---------- Contents grid ---------- */
.contents{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 15px 18px;margin-bottom:20px}
.contents .ch{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px;flex-wrap:wrap}
.contents .ch b{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--navy)}
.contents .ch .tg{font-size:19px;color:var(--muted)}
.contents .ch .tg.ar{font-family:var(--f-ar);direction:rtl}.contents .ch .tg.zh{font-family:var(--f-zh)}
.contents .ch small{font-size:12px;color:var(--muted);font-weight:500;width:100%}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ssec{display:flex;align-items:center;gap:11px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:10px 11px;cursor:pointer;font:inherit;transition:border-color .12s,background .12s,transform .1s}
.ssec:active{transform:scale(.97);background:#f5f7fc}
.ssec.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
.ssec .num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px;display:grid;place-items:center}
.ssec .tt{min-width:0;display:flex;flex-direction:column;gap:1px}
.ssec .tt b{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.15}
.ssec .tt i{font-style:normal;font-size:15px;color:var(--muted);line-height:1.4}
.ssec .tt i.ar{font-family:var(--f-ar);direction:rtl}.ssec .tt i.zh{font-family:var(--f-zh)}
.jump{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;align-items:center;gap:7px;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:13px;color:#fff;padding:11px 16px;border-radius:999px;background:linear-gradient(120deg,var(--navy),#0b1738);box-shadow:0 8px 22px rgba(16,33,78,.34)}
.jump svg{width:15px;height:15px;stroke:#fff;stroke-width:2.4;fill:none}

@media (max-width:860px){
  body{padding-bottom:20px}
  .wrap{display:block;padding:16px 15px 8px}
  .search{min-width:0}
  .rail{display:none}
  .contents{display:block}
  .jump{display:flex}
  .section{scroll-margin-top:60px;margin-bottom:16px}
  .sec-head{padding:14px 16px}
  .sec-body{padding:16px 15px 20px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
  .phrase-list{grid-template-columns:1fr}
  .regrow{grid-template-columns:1fr}
  .verbtn{flex:1;min-width:0}
  .tb-inner{gap:8px;padding:10px 15px}
  .search{min-width:120px}
  .tb-seg button{padding:8px 15px;font-size:12.5px}
}
@media (min-width:861px){.contents{display:none!important}.jump{display:none!important}}
@media print{
  .toolbar,.rail,.overlay,.jump,.foot .warn,.install,.langbar{display:none!important}
  .wrap{grid-template-columns:1fr;padding:0}
  .section{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .card,.phrase{break-inside:avoid}
}
/* ---------- Chained Communication (embedded module) ---------- */
:root{--sym:#d21f2c;--med:#0d8a8a;--alg:#e07b1a;--meal:#4b3f9e;--proc:#2563a8;--wc:#7c4da6;--relig:#1c7d5a;--needs:#c0562b}
.cw-lede{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.6}
.cw-footnote{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.6}
.cw-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cw-tile{--c:var(--accent);border:1.5px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);
  padding:16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s}
.cw-tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(16,33,78,.13)}
.cw-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.cw-ic-big{font-size:28px;line-height:1}
.cw-tile b{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink)}
.cw-nat{font-size:18px;color:var(--muted)}
.cw-nat.ar{font-family:var(--f-ar);direction:rtl}
.cw-nat.zh{font-family:var(--f-zh)}

.cw-subbar{display:flex;align-items:center;gap:10px;padding:10px 4px 16px}
.cw-subbar .cw-accent{width:8px;height:32px;border-radius:5px;background:var(--c);flex-shrink:0}
.cw-name{flex:1;min-width:0}
.cw-name b{font-family:var(--f-display);font-size:14.5px;display:block;color:var(--ink)}
.cw-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
.cw-btn.ghost{color:var(--muted)}
.cw-btn.primary{background:var(--c);color:#fff;border-color:var(--c);font-weight:700}
.cw-btn.skip{color:var(--muted);background:none;border:none}

.cw-q{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.cw-step{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.cw-hl-big{font-size:16px;font-weight:700;color:var(--ink);line-height:1.3}
.cw-nat-big{font-size:22px;color:var(--navy);margin-top:6px}
.cw-nat-big.zh{font-size:19px}
.cw-hint{font-size:12px;color:var(--muted);margin:0 2px 12px;display:flex;align-items:center;gap:6px}

.cw-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cw-opt{--c:var(--accent);border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:4px;min-height:92px;justify-content:center;text-align:center;position:relative;transition:border-color .12s,box-shadow .12s}
.cw-opt:hover{box-shadow:0 6px 16px rgba(16,33,78,.10);border-color:var(--c)}
.cw-ic{font-size:22px}
.cw-hl{font-size:13px;font-weight:600;line-height:1.2;color:var(--ink)}
.cw-tg{font-size:19px;color:var(--muted)}
.cw-tg.zh{font-size:16px}
.cw-opt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,#fff) inset}
.cw-opt.on .cw-tick{position:absolute;top:6px;right:8px;color:var(--c);font-weight:800;font-size:14px}
.cw-hourgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cw-hour{min-height:58px}
.cw-num{font-size:19px;font-weight:700;color:var(--ink)}

.cw-nextrow{display:flex;gap:10px;margin-top:14px}
.cw-nextrow .cw-btn.primary{flex:1;padding:12px;font-size:14px}

.cw-done{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);text-align:center}
.cw-big{font-size:32px;margin-bottom:4px}
.cw-done h2{margin:0 0 4px;font-size:17px;font-family:var(--f-display)}
.cw-done p{color:var(--muted);font-size:13px;margin:0 0 14px}

.cw-strip{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  box-shadow:0 -6px 18px rgba(20,30,45,.10);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:95;max-width:1180px;margin:0 auto}
.cw-strip.hidden{display:none}
.cw-lbl{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.cw-natline{font-size:20px;color:var(--ink);min-height:30px;padding:2px 2px 4px}
.cw-natline.ar{font-family:var(--f-ar);direction:rtl;text-align:right}
.cw-natline.zh{font-family:var(--f-zh);font-size:17px}
.cw-enline{font-size:12px;color:var(--muted);margin-top:2px}
.cw-strow{display:flex;gap:8px;margin-top:10px}
.cw-show{flex:1;background:var(--navy);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.cw-clear{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 14px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}

.cw-overlay{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:110;display:none;flex-direction:column;padding:26px}
.cw-overlay.show{display:flex}
.cw-ov-top{display:flex;justify-content:space-between;align-items:center}
.cw-ov-tag{font-size:12px;opacity:.75;letter-spacing:.5px;text-transform:uppercase}
.cw-ov-close{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:11px;padding:11px 17px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.cw-ov-center{margin:auto 0;display:flex;flex-direction:column;gap:18px}
.cw-ov-natbig{font-size:clamp(28px,7vw,50px);line-height:1.7;text-align:center}
.cw-ov-natbig.ar{font-family:var(--f-ar);direction:rtl}
.cw-ov-natbig.zh{font-family:var(--f-zh);font-size:clamp(22px,5.5vw,40px)}
.cw-ov-enbig{font-size:clamp(14px,3vw,20px);opacity:.7;text-align:center;line-height:1.5}
.cw-ov-foot{margin-top:auto;font-size:11px;opacity:.55;text-align:center}
.cw-prog{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.cw-prog .cw-dots{display:flex;gap:5px;flex-wrap:wrap}
.cw-prog .cw-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.cw-prog .cw-dot.done{background:var(--c)}
.cw-prog .cw-dot.cur{background:var(--c);transform:scale(1.45)}
.cw-prog .cw-step-lbl{font-size:11px;color:var(--muted);font-weight:700}
.cw-swipehint{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0 10px;opacity:.85}

@media(max-width:520px){
  .cw-tiles{grid-template-columns:1fr 1fr}
  .cw-opts{grid-template-columns:1fr 1fr}
  .cw-hourgrid{grid-template-columns:repeat(4,1fr)}
}

</style>
</head>

function dta(o){return `data-en="${esc(o.en)}" data-bm="${esc(o.bm||o.en)}" data-ar="${esc(o.ar||'')}" data-zh="${esc(o.zh||'')}" data-py="${esc(o.py||'')}"`;}
// bilingual inline node: helper + target(+py). variant: 'card'|'phrase'|'label'|'note'|'reg'|'irow'
function triSpans(){return `<span class="tg"></span><span class="py"></span>`;}

function cardHTML(c,color){
  const isBadge=c.e && (c.e.startsWith('×')||/^\d/.test(c.e));
  const icon=c.e?(isBadge?`<div class="badge">${c.e}</div>`:`<div class="emoji">${c.e}</div>`):'';
  return `<button class="card i18n" data-role="card" style="--c:${color}" ${dta(c)}>
    ${icon}<div class="tg"></div><div class="py"></div><div class="hl"></div></button>`;
}
function labelHTML(l){ if(!l)return '';
  return `<div class="sublabel i18n" data-role="label" ${dta(l)}><span class="hl en"></span><span class="tg"></span></div>`;
}
function noteHTML(n,color,warn){
  return `<div class="note i18n" data-role="note" style="--c:${color}" ${dta(n)}><span class="ic">${warn?'⚠️':'ℹ️'}</span>
    <div class="ntxt"><div class="hl"></div><div class="tg"></div><div class="py"></div></div></div>`;
}
function phraseHTML(p,color,emg){
  return `<button class="phrase i18n ${emg?'emg':''}" data-role="phrase" style="--c:${color}" ${dta(p)}>
    <span class="hl"></span><span class="rgt"><span class="tg"></span><span class="py"></span></span></button>`;
}

function buildInfo(s){
  let body='';
  (s.blocks||[]).forEach(b=>{
    if(b.kind==='cards'){
      body+=labelHTML(b.head);
      body+='<div class="grid">'+b.cards.map(c=>cardHTML(c,s.color)).join('')+'</div>';
    } else if(b.kind==='phrases'){
      body+=labelHTML(b.head);
      body+='<div class="phrase-list">'+b.pairs.map(p=>phraseHTML(p,s.color,b.emergency)).join('')+'</div>';
    } else if(b.kind==='schedule'||b.kind==='contacts'){
      body+=labelHTML(b.head);
      let rows=b.rows.map(r=>{
        const val = r.tel? `<a class="v tel" href="tel:${r.tel}">${r.v}</a>` : `<span class="v ${r.v==='—'?'dash':''}">${r.v}</span>`;
        return `<div class="irow"><div class="k i18n" data-role="irow" ${dta(r.k)}><span class="en hl"></span><span class="tg"></span><span class="py"></span></div>${val}</div>`;
      }).join('');
      body+=`<div class="iblock ${s.pending?'pending':''}"><div class="itable">${rows}</div></div>`;
    } else if(b.kind==='links'){
      body+=labelHTML(b.head);
      let rows=b.rows.map(r=>`<div class="irow link"><span class="lk">${typeof r.label==='string'?r.label:r.label}</span><a class="v" href="${r.url}" target="_blank" rel="noopener">Open ↗</a></div>`).join('');
      body+=`<div class="iblock"><div class="itable">${rows}</div></div>`;
    }
  });
  return body;
}

DATA.forEach(s=>{
  // rail tab
  const tab=document.createElement('button');
  tab.className='tab';tab.style.setProperty('--c',s.color);tab.dataset.target=s.id;
  tab.innerHTML=`<span class="dot"></span><span class="n">${String(s.no).padStart(2,'0')}</span><span class="lbl">${s.title.en}</span>`;
  tab.onclick=()=>document.getElementById(s.id).scrollIntoView({block:'start'});
  rail.appendChild(tab);

  const sec=document.createElement('section');
  sec.className='section';sec.id=s.id;sec.dataset.no=s.no;
  let body='';
  if(s.note && s.type!=='steps' && s.type!=='info') body+=noteHTML(s.note,s.color,false);
  if(s.type==='info' && s.note) body+=noteHTML(s.note,s.color,false);

  if(s.type==='steps'){
    body+='<ol style="display:grid;gap:10px;list-style:none">';
    s.steps.forEach((st,i)=>{ body+=`<li class="i18n" data-role="note" ${dta(st)} style="display:flex;gap:14px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px">
      <span style="font-family:var(--f-display);font-weight:800;color:${s.color};font-size:20px;min-width:26px">${i+1}</span>
      <div style="flex:1" class="ntxt"><div class="hl" style="font-weight:600;font-size:14.5px"></div><div class="tg" style="font-size:19px;color:var(--navy);margin-top:5px;font-weight:700"></div><div class="py"></div></div></li>`; });
    body+='</ol>';
    if(s.note) body+='<div style="margin-top:16px">'+noteHTML(s.note,s.color,true)+'</div>';
  }
  else if(s.type==='cards'){
    s.sub.forEach(g=>{ body+=labelHTML(g.label); body+='<div class="grid">'+g.cards.map(c=>cardHTML(c,s.color)).join('')+'</div>'; });
    if(s.resp){ body+='<div class="resp-row">'+labelHTML({en:'Response',bm:'Respons',ar:'الِاسْتِجَابَةُ',zh:'回應',py:'Huíyìng'})+'<div class="grid">'+s.resp.map(c=>cardHTML(c,s.color)).join('')+'</div></div>'; }
  }
  else if(s.type==='reg'){
    s.sub.forEach(g=>{ body+=labelHTML(g.label); body+='<div class="grid">'+g.cards.map(c=>cardHTML(c,s.color)).join('')+'</div>'; });
    body+=labelHTML({en:'Patient Details',bm:'Butiran Pesakit',ar:'بَيَانَاتُ المَرِيضِ',zh:'病人資料',py:'Bìngrén zīliào'});
    body+='<div class="regform">'+s.form.map(f=>`<div class="regrow"><div class="reglabel i18n" data-role="reg" style="--c:${s.color}" ${dta(f)}><span class="hl"></span><span class="tg"></span></div><div class="regfield"></div></div>`).join('')+'</div>';
    s.extra.forEach(g=>{ body+=labelHTML(g.label); body+='<div class="grid">'+g.cards.map(c=>cardHTML(c,s.color)).join('')+'</div>'; });
  }
  else if(s.type==='phrases'){
    s.groups.forEach(g=>{ body+=labelHTML(g.label); body+='<div class="phrase-list">'+g.pairs.map(p=>phraseHTML(p,s.color,g.emergency)).join('')+'</div>'; });
    if(s.resp){ body+='<div class="resp-row">'+labelHTML({en:'Response',bm:'Respons',ar:'الِاسْتِجَابَةُ',zh:'回應',py:'Huíyìng'})+'<div class="grid">'+s.resp.map(c=>cardHTML(c,s.color)).join('')+'</div></div>'; }
  }
  else if(s.type==='info'){ body+=buildInfo(s); }
  else if(s.type==='chained'){ body+='<div id="cwRoot" class="cw"></div>'; }

  const pend = s.pending? `<span class="pending-tag">Pending</span>`:'';
  sec.innerHTML=`<div class="sec-head" style="--c:${s.color}">
    <div class="l"><span class="sec-num">${String(s.no).padStart(2,'0')}</span><span class="sec-en">${s.title.en}${pend}</span></div>
    <span class="sec-tg" data-ar="${esc(s.title.ar)}" data-zh="${esc(s.title.zh)}" data-py="${esc(s.title.py)}" data-en="${esc(s.title.en)}" data-bm="${esc(s.title.bm)}"></span>
  </div><div class="sec-body">${body}</div>`;
  secWrap.appendChild(sec);
});

/* ---------- Language state & apply ---------- */
let VER='ar', HELP='en';
try{ VER=localStorage.getItem('ver')||'ar'; HELP=localStorage.getItem('help')||'en'; }catch(e){}

function setActive(sel,attr,val){ document.querySelectorAll(sel).forEach(b=>b.classList.toggle('on', b.dataset[attr]===val)); }

function applyLang(){
  document.documentElement.dataset.ver=VER;
  document.documentElement.dataset.help=HELP;
  // every i18n node
  document.querySelectorAll('.i18n').forEach(node=>{
    const en=node.dataset.en||'', bm=node.dataset.bm||en, ar=node.dataset.ar||'', zh=node.dataset.zh||'', py=node.dataset.py||'';
    const hl=node.querySelector('.hl');
    const tg=node.querySelector('.tg');
    const pyEl=node.querySelector('.py');
    if(hl) hl.textContent = (HELP==='en'?en:bm);
    if(tg){
      const t = VER==='ar'? ar : zh;
      tg.textContent = t || '⋯';
      tg.classList.remove('ar','zh'); tg.classList.add(VER==='ar'?'ar':'zh');
    }
    if(pyEl){
      if(VER==='zh' && py){ pyEl.textContent=py; pyEl.style.display=''; }
      else { pyEl.textContent=''; pyEl.style.display='none'; }
    }
  });
  // section header target
  document.querySelectorAll('.sec-tg').forEach(el=>{
    const t = VER==='ar'? el.dataset.ar : el.dataset.zh;
    el.textContent = t||'';
    el.classList.remove('ar','zh'); el.classList.add(VER==='ar'?'ar':'zh');
  });
  // contents grid target
  document.querySelectorAll('.ssec .tt i').forEach(el=>{
    const t=VER==='ar'?el.dataset.ar:el.dataset.zh; el.textContent=t||'';
    el.classList.remove('ar','zh'); el.classList.add(VER==='ar'?'ar':'zh');
    const b=el.previousElementSibling; if(b) b.textContent=(HELP==='en'?el.dataset.en:el.dataset.bm);
  });
  // masthead
  const h1=document.getElementById('mastH1');
  const mtg=document.getElementById('mastTg');
  const msub=document.getElementById('mastSub');
  if(VER==='ar'){ h1.innerHTML='Arabic Communication<br><span class="thin">Guide Book</span>'; mtg.textContent='دَلِيلُ التَّوَاصُلِ'; }
  else { h1.innerHTML='Mandarin Communication<br><span class="thin">Guide Book · 中文</span>'; mtg.textContent='溝通指南手冊'; }
  mtg.classList.remove('ar','zh'); mtg.classList.add(VER==='ar'?'ar':'zh');
  // footer warn target
  // buttons active
  // generic static UI text (top masthead + footer + overlay + install banner)
  document.querySelectorAll('.uitext').forEach(el=>{
    const en=el.dataset.en, bm=el.dataset.bm;
    if(en!=null) el.textContent = (HELP==='en'? en : (bm||en));
  });
  // generic target-language swap for non-DATA chrome (footer warn, iu, pclose)
  document.querySelectorAll('.tg-swap').forEach(el=>{
    const tAr=el.dataset.ar||'', tZh=el.dataset.zh||'';
    el.textContent = VER==='ar'? tAr : tZh;
    el.classList.remove('ar','zh'); el.classList.add(VER==='ar'?'ar':'zh');
  });
  // search placeholder
  const qEl=document.getElementById('q');
  if(qEl) qEl.placeholder = (HELP==='en')? 'Search any word — pain, fever, أَلَم, 疼痛…' : 'Cari sebarang perkataan — sakit, demam, أَلَم, 疼痛…';
  // install banner button + iOS steps (depends on HELP and iOS-mode)
  const instBtn=document.getElementById('installBtn');
  if(instBtn){
    const iosMode=document.getElementById('installBox').classList.contains('ios-mode');
    instBtn.textContent = (HELP==='en') ? (iosMode?'How to Install':'Install') : (iosMode?'Cara Memasang':'Pasang');
  }
  const iosStepsEl=document.getElementById('iosSteps');
  if(iosStepsEl){
    iosStepsEl.innerHTML = (HELP==='en')
      ? 'On iPhone/iPad: tap <b>Share</b> (⬆️) in Safari, then <b>"Add to Home Screen"</b> → <b>Add</b>.'
      : 'Di iPhone/iPad: ketik <b>Share</b> (⬆️) dalam Safari, kemudian <b>"Add to Home Screen"</b> → <b>Add</b>.';
  }
  setActive('button[data-ver]','ver',VER); setActive('button[data-help]','help',HELP);
  const _ct=(VER==='ar')?'المُحْتَوَيَات':'目錄';
  const jt=document.getElementById('jumpTg'); if(jt){jt.textContent=_ct; jt.className=(VER==='ar'?'ar':'zh');}
  const ct=document.getElementById('contentsTg'); if(ct){ct.textContent=_ct; ct.className='tg '+(VER==='ar'?'ar':'zh');}
  try{ localStorage.setItem('ver',VER); localStorage.setItem('help',HELP); }catch(e){}
  if(overlay.classList.contains('on') && curEl) fillPatient(curEl);
}
function chooseVer(v){ VER=v; applyLang(); }
function chooseHelp(h){ HELP=h; applyLang(); }
document.querySelectorAll('button[data-ver]').forEach(b=>b.addEventListener('click',()=>chooseVer(b.dataset.ver)));
document.querySelectorAll('button[data-help]').forEach(b=>b.addEventListener('click',()=>chooseHelp(b.dataset.help)));

/* ---------- Patient overlay ---------- */
const overlay=document.getElementById('overlay');
const pcard=document.getElementById('pcard');
let curEl=null;
function fillPatient(el){
  const en=el.dataset.en||'',bm=el.dataset.bm||en,ar=el.dataset.ar||'',zh=el.dataset.zh||'',py=el.dataset.py||'';
  let emoji='';
  const em=el.querySelector('.emoji'); const bd=el.querySelector('.badge');
  const pe=document.getElementById('pemoji');
  if(bd){ pe.innerHTML=`<span class="pcard-badge">${bd.textContent}</span>`; pe.style.display='block'; }
  else if(em){ pe.textContent=em.textContent; pe.style.display='block'; }
  else { pe.style.display='none'; }
  const t = VER==='ar'?ar:zh;
  const ptg=document.getElementById('ptg'); ptg.textContent=t||'⋯';
  ptg.classList.remove('ar','zh'); ptg.classList.add(VER==='ar'?'ar':'zh');
  const ppy=document.getElementById('ppy');
  if(VER==='zh'&&py){ppy.textContent=py;ppy.style.display='';}else{ppy.textContent='';ppy.style.display='none';}
  document.getElementById('pen').textContent = (HELP==='en'?en:bm);
  const sec=el.closest('.section');
  document.getElementById('pcat').textContent = sec? sec.querySelector('.sec-en').textContent.replace('Pending','').trim() : '';
  const color=getComputedStyle(el).getPropertyValue('--c').trim();
  pcard.style.setProperty('--c',color||'#10214e');
}
function openPatient(el){ curEl=el; fillPatient(el); overlay.classList.add('on'); document.getElementById('pclose').focus(); }
function closePatient(){overlay.classList.remove('on');curEl=null;}
document.getElementById('pclose').onclick=closePatient;
overlay.onclick=e=>{if(e.target===overlay)closePatient()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePatient()});
secWrap.addEventListener('click',e=>{const el=e.target.closest('.card,.phrase');if(el)openPatient(el)});

/* ---------- Search ---------- */
const q=document.getElementById('q');
const noresult=document.getElementById('noresult');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase(); let any=false;
  document.querySelectorAll('.section').forEach(sec=>{
    let vis=0;
    sec.querySelectorAll('.card,.phrase').forEach(el=>{
      const hay=((el.dataset.en||'')+' '+(el.dataset.bm||'')+' '+(el.dataset.ar||'')+' '+(el.dataset.zh||'')+' '+(el.dataset.py||'')).toLowerCase();
      const show=!v||hay.includes(v); el.style.display=show?'':'none'; if(show)vis++;
    });
    const has=sec.querySelector('.card,.phrase');
    if(v&&has){ sec.style.display=vis?'':'none'; } else { sec.style.display=''; }
    if(vis)any=true;
  });
  noresult.classList.toggle('on', v&&!any);
});

/* ---------- Contents grid ---------- */
const contents=document.createElement('div');
contents.className='contents';contents.id='contents';
let cg='<div class="ch"><b>Contents</b><span class="tg" id="contentsTg"></span><small>Tap any section to jump straight to it.</small></div><div class="cgrid">';
DATA.forEach(s=>{ cg+=`<button class="ssec" style="--c:${s.color}" data-target="${s.id}"><span class="num">${String(s.no).padStart(2,'0')}</span><span class="tt"><b>${s.title.en}</b><i data-en="${esc(s.title.en)}" data-bm="${esc(s.title.bm)}" data-ar="${esc(s.title.ar)}" data-zh="${esc(s.title.zh)}"></i></span></button>`; });
cg+='</div>';contents.innerHTML=cg;
document.getElementById('installBox').after(contents);
contents.querySelectorAll('.ssec').forEach(b=>{ b.onclick=()=>document.getElementById(b.dataset.target).scrollIntoView({block:'start'}); });
document.getElementById('jumpTop').onclick=()=>contents.scrollIntoView({block:'start'});
// contents header target follows version
const chTg=contents.querySelector('.ch .tg');

/* ---------- Scroll spy ---------- */
const navItems=[...document.querySelectorAll('[data-target]')];
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
  navItems.forEach(t=>t.classList.remove('active'));
  navItems.filter(t=>t.dataset.target===e.target.id).forEach(t=>{t.classList.add('active'); if(t.classList.contains('tab'))t.scrollIntoView({block:'nearest'});});
}})},{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('.section').forEach(s=>obs.observe(s));

/* ---------- Install ---------- */
(function(){
  const box=document.getElementById('installBox'),btn=document.getElementById('installBtn'),x=document.getElementById('installX'),ios=document.getElementById('iosSteps');
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let dismissed=false; try{dismissed=sessionStorage.getItem('installDismissed')==='1';}catch(e){}
  let deferred=null;
  if(isStandalone||dismissed)return;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;box.classList.add('on');});
  if(isIOS){box.classList.add('on','ios-mode');btn.textContent='How to Install';}
  btn.onclick=async()=>{ if(deferred){deferred.prompt();const{outcome}=await deferred.userChoice;if(outcome==='accepted')box.classList.remove('on');deferred=null;} else {ios.classList.toggle('on');} };
  x.onclick=()=>{box.classList.remove('on');try{sessionStorage.setItem('installDismissed','1');}catch(e){}};
  window.addEventListener('appinstalled',()=>box.classList.remove('on'));
})();

applyLang();
</script>

const FLOW_ICON={sym:"🤒",med:"💊",alg:"⚠️",meal:"🍽️",proc:"📝",wc:"🚻",relig:"🕌",needs:"🤲"};
const FLOW_COLOR={sym:"#d21f2c",med:"#0d8a8a",alg:"#e07b1a",meal:"#4b3f9e",proc:"#2563a8",wc:"#7c4da6",relig:"#1c7d5a",needs:"#c0562b"};

/* ============== Chained Communication — integrated engine ============== */
const AR_DIGITS2=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const cwToAr=n=>String(n).split('').map(d=>/[0-9]/.test(d)?AR_DIGITS2[+d]:d).join('');
function cwNatCls(){return VER==='zh'?'zh':'ar';}
function cwPick(obj){ if(!obj)return ''; return (VER==='zh'? obj.zh : obj.ar) || ''; }
function cwPickHelp(obj){ if(!obj)return ''; return (HELP==='bm'? (obj.bm||obj.en) : obj.en) || ''; }
function u2(key){ return cwPickHelp(UI2[key]); }

let cwTopic=null, cwPath=[], cwSelections=[], cwBuilt=false;
const cw$=id=>document.getElementById(id);

function cwReset(){cwTopic=null;cwPath=[];cwSelections=[];cwRender();if(history.state&&history.state.cwA){history.replaceState({},'');}}
function cwSyncHistory(){var o=cw$('cwOverlay');var ov=o&&o.classList.contains('show');if((cwTopic||ov)&&!(history.state&&history.state.cwA)){history.pushState({cwA:1},'');}}
function cwStartTopic(t){cwTopic=t;cwPath=[FLOWS2[t].start];cwSelections=[];cwRender();}
function cwBack(){
  if(!cwTopic)return;
  const cur=cwPath[cwPath.length-1];
  cwSelections=cwSelections.filter(s=>!s.key.startsWith(cur+':'));
  if(cwPath.length>1){cwPath.pop();cwRender();}else{cwReset();}
}
function cwAddSel(key,c){if(!cwSelections.some(s=>s.key===key))cwSelections.push({key,c});}
function cwToggleSel(key,c){
  const i=cwSelections.findIndex(s=>s.key===key);
  if(i>=0)cwSelections.splice(i,1);else cwSelections.push({key,c});
}
function cwGoto(next){ cwPath.push(next?next:'__done__'); cwRender(); }

function cwTap(stepId,idx){
  const step=FLOWS2[cwTopic].steps[stepId];
  const o=step.opts[idx];
  const key=stepId+':'+idx;
  if(step.mode==='multi'){
    if(o.c)cwToggleSel(key,o.c);
    cwRender();
  }else{
    cwSelections=cwSelections.filter(s=>!s.key.startsWith(stepId+':'));
    if(o.c)cwAddSel(key,o.c);
    const next = ('next' in o)?o.next:step.next;
    cwGoto(next);
  }
}
function cwPickHour(h){
  const cur=cwPath[cwPath.length-1];
  cwSelections=cwSelections.filter(s=>!s.key.startsWith(cur+':'));
  cwAddSel(cur+':h',{en:"at "+h+" o'clock",bm:'pada pukul '+h,ar:'السَّاعَةُ '+cwToAr(h),zh:h+'點'});
  cwGoto(FLOWS2[cwTopic].steps[cur].next);
}

function cwEnsureChrome(){
  if(cw$('cwStrip'))return;
  const strip=document.createElement('div');
  strip.id='cwStrip'; strip.className='cw-strip hidden';
  strip.innerHTML=`<div class="cw-lbl" id="cwStripLbl"></div>
    <div class="cw-natline" id="cwStripNat"></div>
    <div class="cw-enline" id="cwStripEn"></div>
    <div class="cw-strow">
      <button class="cw-show" id="cwShowBtn">🔍 <span id="cwShowBtnTxt"></span></button>
      <button class="cw-clear" id="cwClearBtn"></button>
    </div>`;
  document.body.appendChild(strip);

  const overlay=document.createElement('div');
  overlay.id='cwOverlay'; overlay.className='cw-overlay';
  overlay.innerHTML=`<div class="cw-ov-top">
      <span class="cw-ov-tag" id="cwOvTag"></span>
      <button class="cw-ov-close" id="cwOvClose"></button>
    </div>
    <div class="cw-ov-center">
      <div class="cw-ov-natbig" id="cwOvNat"></div>
      <div class="cw-ov-enbig" id="cwOvEn"></div>
    </div>
    <div class="cw-ov-foot" id="cwOvFoot"></div>`;
  document.body.appendChild(overlay);

  cw$('cwShowBtn').onclick=()=>{
    const NC=cwNatCls();
    const natEl=cw$('cwOvNat'); natEl.className='cw-ov-natbig '+NC;
    natEl.textContent=cwSelections.map(s=>cwPick(s.c)).join('  ·  ');
    cw$('cwOvEn').textContent=cwSelections.map(s=>cwPickHelp(s.c)).join('  ·  ');
    cw$('cwOvTag').textContent=cwTopic?cwPickHelp(FLOWS2[cwTopic].title):'';
    cw$('cwOvFoot').textContent=u2('overlayFoot');
    cw$('cwOvClose').textContent=u2('close');
    overlay.classList.add('show');
    cwSyncHistory();
  };
  cw$('cwOvClose').onclick=()=>overlay.classList.remove('show');
  overlay.onclick=e=>{ if(e.target===overlay) overlay.classList.remove('show'); };
  cw$('cwClearBtn').onclick=()=>{cwSelections=[];cwRender();};

  var cwR=cw$('cwRoot');
  if(cwR && !cwR.dataset.cwSwipe){
    cwR.dataset.cwSwipe='1';
    var sx=0,sy=0,stt=0;
    cwR.addEventListener('touchstart',function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;stt=Date.now();},{passive:true});
    cwR.addEventListener('touchend',function(e){var t=e.changedTouches[0];var dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-stt;if(dt>700||Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.4)return;if(dx>0){if(cwTopic)cwBack();}else{cwSwipeForward();}},{passive:true});
  }
  if(!window.__cwPop){
    window.__cwPop=1;
    window.addEventListener('popstate',function(){
      var o=cw$('cwOverlay');
      if(o&&o.classList.contains('show')){o.classList.remove('show');cwSyncHistory();return;}
      if(cwTopic){
        if(cwPath.length>1){var cur=cwPath[cwPath.length-1];cwSelections=cwSelections.filter(function(x){return !x.key.startsWith(cur+':');});cwPath.pop();cwRender();}
        else{cwTopic=null;cwPath=[];cwSelections=[];cwRender();}
      }
    });
  }
}

function cwRenderStrip(){
  cwSyncHistory();
  const strip=cw$('cwStrip'); if(!strip)return;
  if(!cwTopic || cwSelections.length===0){strip.classList.add('hidden');return;}
  strip.classList.remove('hidden');
  const NC=cwNatCls();
  cw$('cwStripLbl').textContent=u2('answerBuilding');
  const natEl=cw$('cwStripNat'); natEl.className='cw-natline '+NC;
  natEl.textContent=cwSelections.map(s=>cwPick(s.c)).join('  ·  ');
  cw$('cwStripEn').textContent=cwSelections.map(s=>cwPickHelp(s.c)).join('  ·  ');
  cw$('cwShowBtnTxt').textContent=u2('showPatient');
  cw$('cwClearBtn').textContent=u2('clear');
}

function cwOptCard(cur,idx,o,color){
  const key=cur+':'+idx;
  const on=cwSelections.some(s=>s.key===key);
  return `<div class="cw-opt ${on?'on':''}" style="--c:${color}" onclick="cwTap('${cur}',${idx})">
    ${o.ic?`<span class="cw-ic">${o.ic}</span>`:''}
    <span class="cw-hl">${cwPickHelp(o.l)}</span>
    <span class="cw-tg ${cwNatCls()}">${cwPick(o.l)}</span>
    ${on?'<span class="cw-tick">✓</span>':''}
  </div>`;
}

function cwProgress(){
  if(!cwTopic) return '';
  const cur=cwPath[cwPath.length-1];
  if(cur==='__done__') return '';
  const total=Math.max(Object.keys(FLOWS2[cwTopic].steps).length, cwPath.length);
  const pos=cwPath.length;
  let dots='';
  for(let i=0;i<total;i++){ dots+=`<span class="cw-dot ${i<pos-1?'done':(i===pos-1?'cur':'')}"></span>`; }
  const hint = pos===1 ? `<div class="cw-swipehint">\u21C4 ${u2('swipeHint')}</div>` : '';
  return `<div class="cw-prog" style="--c:${FLOW_COLOR[cwTopic]}"><div class="cw-dots">${dots}</div><span class="cw-step-lbl">${pos} / ${total}</span></div>${hint}`;
}
function cwSwipeForward(){
  if(!cwTopic) return;
  const cur=cwPath[cwPath.length-1];
  if(cur==='__done__') return;
  const step=FLOWS2[cwTopic].steps[cur];
  if(step && (step.mode==='multi'||step.mode==='hour')){ cwGoto(step.next); }
}
function cwRender(){
  cwEnsureChrome();
  const root=cw$('cwRoot');
  if(!root)return;
  const NC=cwNatCls();

  if(!cwTopic){
    root.innerHTML=`
      <p class="cw-lede">${u2('lede')}</p>
      <div class="cw-tiles">
        ${Object.entries(FLOWS2).map(([k,f])=>`
          <div class="cw-tile" style="--c:${FLOW_COLOR[k]}" onclick="cwStartTopic('${k}')">
            <span class="cw-ic-big">${FLOW_ICON[k]}</span>
            <b>${cwPickHelp(f.title)}</b>
            <span class="cw-nat ${NC}">${cwPick(f.title)}</span>
          </div>`).join('')}
      </div>
      <div class="cw-footnote">${u2('footer')}</div>`;
    cwRenderStrip();
    return;
  }

  const f=FLOWS2[cwTopic];
  const color=FLOW_COLOR[cwTopic];
  const cur=cwPath[cwPath.length-1];
  const progress=cwProgress();

  const subbar=`<div class="cw-subbar" style="--c:${color}">
      <span class="cw-accent"></span>
      <div class="cw-name"><b>${cwPickHelp(f.title)}</b><span class="cw-nat ${NC}">${cwPick(f.title)}</span></div>
      <button class="cw-btn ghost" onclick="cwBack()">‹ ${u2('back')}</button>
      <button class="cw-btn ghost" onclick="cwReset()">${u2('reset')}</button>
    </div>`;

  if(cur==='__done__'){
    root.innerHTML=subbar+`
      <div class="cw-done">
        <div class="cw-big">✅</div>
        <h2>${u2('done')}</h2>
        <p>${u2('doneSub')}</p>
        <div class="cw-nextrow">
          <button class="cw-btn primary" style="--c:${color}" onclick="cwReset()">＋ ${u2('newTopic')}</button>
        </div>
      </div>`;
    cwRenderStrip();
    return;
  }

  const step=f.steps[cur];

  if(step.mode==='hour'){
    root.innerHTML=subbar+progress+`
      <div class="cw-q"><div class="cw-step">${cwPickHelp(f.title)}</div>
        <div class="cw-hl-big">${cwPickHelp(step.q)}</div><div class="cw-nat-big ${NC}">${cwPick(step.q)}</div></div>
      ${step.hint?`<div class="cw-hint">👆 ${cwPickHelp(step.hint)} · ${cwPick(step.hint)}</div>`:''}
      <div class="cw-hourgrid">
        ${Array.from({length:12},(_,i)=>i+1).map(h=>`
          <div class="cw-opt cw-hour" style="--c:${color}" onclick="cwPickHour(${h})">
            <span class="cw-num">${h}</span><span class="cw-nat ${NC}">${VER==='ar'?cwToAr(h):h+'點'}</span>
          </div>`).join('')}
      </div>
      <div class="cw-nextrow"><button class="cw-btn skip" onclick="cwGoto('${step.next}')">${u2('skip')}</button></div>`;
    cwRenderStrip();
    return;
  }

  const isMulti=step.mode==='multi';
  root.innerHTML=subbar+progress+`
    <div class="cw-q"><div class="cw-step">${cwPickHelp(f.title)}</div>
      <div class="cw-hl-big">${cwPickHelp(step.q)}</div><div class="cw-nat-big ${NC}">${cwPick(step.q)}</div></div>
    ${step.hint?`<div class="cw-hint">👆 ${cwPickHelp(step.hint)} · ${cwPick(step.hint)}</div>`:''}
    <div class="cw-opts">
      ${step.opts.map((o,idx)=>cwOptCard(cur,idx,o,color)).join('')}
    </div>
    ${isMulti?`<div class="cw-nextrow"><button class="cw-btn primary" style="--c:${color}" onclick="cwGoto('${step.next}')">${u2('next')}</button></div>`:''}`;
  cwRenderStrip();
}

/* hook into the main guide's language switcher so this section refreshes too */
(function(){
  const _origApplyLang = window.applyLang;
  window.applyLang = function(){
    _origApplyLang();
    if(document.getElementById('cwRoot')) cwRender();
  };
})();
cwRender();

</script>
</body>
</html>
